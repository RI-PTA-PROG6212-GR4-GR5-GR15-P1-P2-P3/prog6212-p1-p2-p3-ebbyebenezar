
name: RaceDay .NET Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Find solution file
      id: solution
      shell: bash
      run: |
        SOLUTION=$(find . -maxdepth 3 -type f \( -name "*.sln" -o -name "*.slnx" \) | head -n 1)
        if [ -z "$SOLUTION" ]; then
          echo "No solution file found!"
          exit 1
        fi
        echo "path=$SOLUTION" >> "$GITHUB_OUTPUT"
        echo "Found solution: $SOLUTION"

    - name: Restore dependencies
      run: dotnet restore "${{ steps.solution.outputs.path }}"

    - name: Build solution
      run: dotnet build "${{ steps.solution.outputs.path }}" --no-restore --configuration Release

    - name: Run tests
      run: dotnet test "${{ steps.solution.outputs.path }}" --no-build --configuration Release --verbosity normal
